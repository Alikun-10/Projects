version: '2.1'

services:
  overeats-checker:
    build: .
    ports:
      - "15432:8000"
    restart: unless-stopped
    environment:
      - MONGO_ENABLED=1
      - MONGO_HOST=overeats-mongo
      - MONGO_PORT=27017
      - MONGO_USER=overeats
      - MONGO_PASSWORD=overeats
    depends_on:
      - overeats-mongo
    mem_limit: 1G
    memswap_limit: 2G
    ulimits:
      core:
        soft: 0
        hard: 0
      nproc:
        soft: 4000
        hard: 4000

  overeats-mongo:
    image: mongo:7
    volumes:
      - ./data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: overeats
      MONGO_INITDB_ROOT_PASSWORD: overeats
    mem_limit: 1G
    memswap_limit: 2G
    ulimits:
      core:
        soft: 0
        hard: 0
      nproc:
        soft: 4000
        hard: 4000

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1420
